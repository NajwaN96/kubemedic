# Namespace-scoped read access to TaskFlow. No Secret contents. No writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubemedic-observer
  namespace: taskflow
  labels:
    app.kubernetes.io/name: kubemedic
    app.kubernetes.io/part-of: kubemedic
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubemedic-observer
  namespace: taskflow
  labels:
    app.kubernetes.io/name: kubemedic
    app.kubernetes.io/part-of: kubemedic
subjects:
  - kind: ServiceAccount
    name: kubemedic
    namespace: kubemedic
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubemedic-observer
---
# Mutation path. This Role is not bound to the watcher ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubemedic-remediator
  namespace: taskflow
  labels:
    app.kubernetes.io/name: kubemedic-remediator
    app.kubernetes.io/part-of: kubemedic
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubemedic-remediator
  namespace: taskflow
  labels:
    app.kubernetes.io/name: kubemedic-remediator
    app.kubernetes.io/part-of: kubemedic
subjects:
  - kind: ServiceAccount
    name: kubemedic-remediator
    namespace: kubemedic
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubemedic-remediator
