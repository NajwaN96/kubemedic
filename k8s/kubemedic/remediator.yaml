# Separate process and ServiceAccount. It shares the SQLite volume with the
# watcher and applies only an approved Deployment patch. The watcher Role
# stays read-only. On this one-node kind cluster the RWO claim can be mounted
# by both pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubemedic-remediator
  namespace: kubemedic
  labels:
    app.kubernetes.io/name: kubemedic-remediator
    app.kubernetes.io/part-of: kubemedic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubemedic-remediator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubemedic-remediator
        app.kubernetes.io/part-of: kubemedic
    spec:
      serviceAccountName: kubemedic-remediator
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: remediator
          image: kubemedic:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.remediation.runner"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kubemedic-config
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kubemedic-data
        - name: tmp
          emptyDir: {}
