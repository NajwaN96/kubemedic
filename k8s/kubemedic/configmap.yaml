apiVersion: v1
kind: ConfigMap
metadata:
  name: kubemedic-config
  namespace: kubemedic
  labels:
    app.kubernetes.io/name: kubemedic
    app.kubernetes.io/part-of: kubemedic
data:
  KUBEMEDIC_NAMESPACE: taskflow
  KUBEMEDIC_INCIDENT_COOLDOWN_SECONDS: "300"
  KUBEMEDIC_EVENT_FRESHNESS_SECONDS: "300"
  KUBEMEDIC_RECOVERY_STABILIZATION_SECONDS: "60"
  KUBEMEDIC_LOG_TAIL_LINES: "100"
  KUBEMEDIC_DEMO_MODE: "false"
  KUBEMEDIC_AI_ENABLED: "false"
  KUBEMEDIC_AI_PROVIDER: openai
  KUBEMEDIC_REMEDIATION_ENABLED: "false"
  KUBEMEDIC_REMEDIATION_MAX_REPLICAS: "5"
  KUBEMEDIC_REMEDIATION_VERIFY_SECONDS: "120"
  KUBEMEDIC_WATCH_ENABLED: "true"
  KUBEMEDIC_DB_PATH: /data/kubemedic.db
