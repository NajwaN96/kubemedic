# Kubernetes-only nginx config. The image default still proxies to the
# Compose hostname "api", so Docker Compose is unchanged.
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-frontend-nginx
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: taskflow
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
            set $upstream taskflow-api.taskflow.svc.cluster.local:8000;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
