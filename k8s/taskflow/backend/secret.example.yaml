# Shape of the database secret. Do not apply this file.
# scripts/k8s-deploy.sh creates secret/taskflow-db with a generated password
# and does not print that password.
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-db
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: taskflow
type: Opaque
stringData:
  password: CHANGE_ME
