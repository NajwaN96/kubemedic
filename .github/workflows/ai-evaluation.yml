name: Offline AI evaluation

on:
  push:
    paths:
      - 'kubemedic/**'
      - '.github/workflows/ai-evaluation.yml'
  pull_request:
    paths:
      - 'kubemedic/**'
      - '.github/workflows/ai-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned application and test dependencies
        run: python -m pip install -r kubemedic/evaluation/requirements.lock.txt
      - name: Production tests and adversarial grader tests
        working-directory: kubemedic
        run: python -m pytest -q tests evaluation/test_evaluation.py
      - name: Offline rules baseline; no API key and no live provider
        working-directory: kubemedic
        env:
          OPENAI_API_KEY: ''
        run: python -m evaluation.run --mode rules --output /tmp/kubemedic-rules.json
